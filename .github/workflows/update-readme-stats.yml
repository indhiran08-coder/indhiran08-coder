name: Update README Stats Daily

on:
  schedule:
    - cron: "30 0 * * *"   # Runs every day at 00:30 UTC (after snake runs)
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update timestamp in README to bust badge cache
        run: |
          # Get current UTC date
          TODAY=$(date -u +"%Y-%m-%d")

          # Replace the last-updated line (or insert one if missing)
          if grep -q "<!-- LAST_UPDATED:" README.md; then
            sed -i "s|<!-- LAST_UPDATED:.*-->|<!-- LAST_UPDATED: ${TODAY} -->|g" README.md
          else
            echo "" >> README.md
            echo "<!-- LAST_UPDATED: ${TODAY} -->" >> README.md
          fi

          echo "Updated last-updated timestamp to: ${TODAY}"

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update stats [$(date -u +'%Y-%m-%d')]"
          git push
